name: Desktop editor
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Configure vendor Chromium sandbox helper on the ephemeral runner
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run chips:fetch
      - name: Build pinned CPC WebAssembly engine
        run: |
          git clone --depth 1 --branch 4.0.15 https://github.com/emscripten-core/emsdk.git .cache/emsdk
          test "$(git -C .cache/emsdk rev-parse HEAD)" = "389a68bc35dcff7ebae4614e1615099dafda00d1"
          .cache/emsdk/emsdk install 4.0.15
          .cache/emsdk/emsdk activate 4.0.15
          EMCC=.cache/emsdk/upstream/emscripten/emcc npm run build:wasm
      - run: npm run typecheck && npm test && npm run build:desktop
      - run: npx playwright install --with-deps chromium
      - name: Browser editing and exports
        run: npm run test:editor
      - name: CPC firmware reference and real runtime recipe
        run: |
          git clone --no-checkout https://github.com/floooh/chips-test.git .cache/firmware-reference
          git -C .cache/firmware-reference checkout 3785836e76c43922f78a50e1f8adfed259ab9672
          CPC_TEST_ROM_DIR=.cache/firmware-reference/examples/roms node tests/firmware-runtime.mjs
          CPC_TEST_ROM_DIR=.cache/firmware-reference/examples/roms CPC_UI_MODE=browser node tests/emulator-ui-smoke.mjs
          CPC_TEST_ROM_DIR=.cache/firmware-reference/examples/roms xvfb-run -a node tests/emulator-ui-smoke.mjs
      - name: Native Electron paths and isolation
        run: xvfb-run -a npm run test:desktop
        env:
          DEBUG: pw:browser*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: editor-alpha-evidence
          path: |
            out/emulator-browser-alpha.png
            out/emulator-desktop-alpha.png
            out/emulator-failure.png
            out/firmware-runtime.json
            out/editor-alpha.png
            out/desktop-alpha.png
            out/project-alpha.png
            out/agent-alpha.png
            out/firmware-alpha.png
            out/renumber-alpha.png
            out/documents-alpha.png
            out/images-alpha.png
            out/pdf-alpha.png
            out/git-alpha.png
            out/git-local-index-alpha.png
            out/workbench-alpha.png
            out/search-alpha.png
            out/save-all-alpha.png
            out/recovery-alpha.png
            out/local-history-alpha.png
            out/drafts-alpha.png
            out/external-alpha.png
            out/agent-durability-alpha.png
            out/git-identity-alpha.png
            out/git-commit-alpha.png
            out/desktop-failure.png
            out/editor-failure.png
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: cpceleste-desktop-alpha
          path: |
            dist/
            package.json
            package-lock.json
            licenses/
          retention-days: 7
