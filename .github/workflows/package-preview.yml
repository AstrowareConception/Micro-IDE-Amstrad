name: Packaging preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - electron-builder.yml
      - package.json
      - package-lock.json
      - scripts/build-desktop.mjs
      - scripts/emulator-build.mjs
      - scripts/prepare_emulator.py
      - scripts/checksums.mjs
      - apps/desktop/**
      - packages/**
      - knowledge/**
      - licenses/**
      - .github/workflows/package-preview.yml

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Build Windows installer and portable executable
        shell: pwsh
        run: npm run package:preview:win
      - name: Verify packaged application stays alive
        shell: pwsh
        run: |
          $exe = Resolve-Path "release\win-unpacked\CPCeleste.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          if ($process.HasExited) { throw "CPCéleste packagé s'est arrêté prématurément (code $($process.ExitCode))." }
          Stop-Process -Id $process.Id -Force
      - name: Generate SHA-256 checksums
        run: node scripts/checksums.mjs release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpceleste-0.38.1-windows-x64
          path: |
            release/CPCeleste-Setup-*.exe
            release/CPCeleste-Portable-*.exe
            release/SHA256SUMS.txt
          retention-days: 14

  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Build AppImage and Debian package
        run: npm run package:preview:linux
      - name: Smoke-test unpacked application
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          set +e
          timeout 8s xvfb-run -a release/linux-unpacked/cpceleste --no-sandbox
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "CPCéleste packagé s'est arrêté prématurément (code $code)." >&2
            exit 1
          fi
      - name: Generate SHA-256 checksums
        run: node scripts/checksums.mjs release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpceleste-0.38.1-linux-x64
          path: |
            release/CPCeleste-*.AppImage
            release/cpceleste_*.deb
            release/SHA256SUMS.txt
          retention-days: 14
