name: Desktop packaging preview

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  # Bootstrap and validate delivery-pipeline changes, not every application push.
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-preview.yml'
      - 'scripts/automatic-preview-release.mjs'

concurrency:
  group: cpceleste-preview-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - id: plan
        name: Skip unchanged published build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automatic-preview-release.mjs plan

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: Windows x64 — NSIS + portable
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Build unsigned Windows preview
        run: npm run package:preview:win
      - name: Smoke-test packaged Windows executable
        run: node scripts/packaged-smoke.mjs win release/packaged-smoke-windows.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpceleste-windows-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/SHA256SUMS-win.txt
            release/packaged-smoke-windows.json

  linux:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: Linux x64 — AppImage + deb
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Build unsigned Linux preview
        run: npm run package:preview:linux
      - name: TypeScript and Node regression suite
        run: npm run typecheck && npm test
      - name: Smoke-test packaged Linux executable
        run: xvfb-run -a node scripts/packaged-smoke.mjs linux release/packaged-smoke-linux.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpceleste-linux-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-linux.txt
            release/packaged-smoke-linux.json

  publish:
    name: Publish GitHub preview release
    needs: [plan, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - name: Verify original hashes and smoke proofs, publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
          EXPECTED_TAG: ${{ needs.plan.outputs.tag }}
        run: node scripts/automatic-preview-release.mjs publish
